
  # 1. Messaging Layer (Replaces Kafka for 16GB RAM constraint)
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: smartline-redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://127.0.0.1:9092
      - --pandaproxy-addr internal://0.0.0.0:28082,external://0.0.0.0:8082
      - --advertise-pandaproxy-addr internal://redpanda:28082,external://127.0.0.1:8082
    ports:
      - "9092:9092"
      - "8082:8082"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    restart: unless-stopped
  # 2. Time-Series Storage for KPIs
  influxdb:
    image: influxdb:2.7
    container_name: smartline-historian
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=smartline2026
      - DOCKER_INFLUXDB_INIT_ORG=smartline-360
      - DOCKER_INFLUXDB_INIT_BUCKET=smartline_kpis
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=super-secret-smartline-token

  # 3. Operational Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: smartline-dashboard
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=smartline
  
  # 4. MQTT Broker for Edge Ingestion
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smartline-mqtt
    ports:
      - "1883:1883"
    command: >
      sh -c "echo 'listener 1883\nallow_anonymous true' > /mosquitto/config/mosquitto.conf && /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"
    volumes:
      - mosquitto-data:/mosquitto/data

volumes:
  redpanda-data:
  influxdb-data:
  influxdb-config:
  grafana-data:
  mosquitto-data: